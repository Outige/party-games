<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A growing collection of quick, phone-friendly party games."
    />
    <title>Party Starter</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">Pass the phone</p>
        <h1>Party<br /><span>Starter</span></h1>
        <p class="intro">Tiny games for big tables. Pick one, gather round, and play.</p>
      </header>

      <section class="games" aria-labelledby="games-heading">
        <div class="section-heading">
          <h2 id="games-heading">Choose a game</h2>
          <span class="game-count" aria-label="1 game available">01</span>
        </div>

        <a class="game-card" href="ice-breakers/index.html">
          <div class="card-art" aria-hidden="true">
            <span class="burst burst-one">✦</span>
            <span class="burst burst-two">✦</span>
            <span class="question-mark">?</span>
          </div>
          <div class="card-copy">
            <p class="game-number">Game 01</p>
            <h3>Ice Breakers</h3>
            <p>Pick a vibe. Pass the phone. Get to know each other.</p>
            <span class="play-label">Play now <span aria-hidden="true">→</span></span>
          </div>
        </a>
      </section>
    </main>

    <footer>More good chaos coming soon.</footer>
  </body>
</html>
